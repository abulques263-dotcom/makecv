name: Build and deploy Calcora site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and build React editor
        run: npm run build
      - name: Assemble existing site plus editor
        shell: bash
        run: |
          mkdir -p _site
          while IFS= read -r -d '' file; do
            mkdir -p "_site/$(dirname "$file")"
            cp "$file" "_site/$file"
          done < <(git ls-files -z)
          rm -rf _site/cv-editor
          cp -R cv-editor _site/cv-editor
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
